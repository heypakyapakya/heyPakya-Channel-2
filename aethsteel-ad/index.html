<!doctype html>
<html
  lang="ms"
  data-composition-variables='[
    {"id":"ctaText","type":"string","label":"CTA","default":"Tekan beg kuning sekarang"},
    {"id":"gold","type":"color","label":"Gold accent","default":"#D9B25F"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #f5f1e8;
        --gold: #d9b25f;
        --gold-hi: #f6e3a6;
        --gold-lo: #8a6a2c;
        --red: #d7262e;
        --char: #141210;
        --yellow: #ffc531;
        --font-display: "Oswald";
        --font-body: "Montserrat";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0a09;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-body);
      }
      /* shared type */
      .say {
        position: absolute;
        left: 80px;
        width: 860px;
        font-family: var(--font-body);
        font-weight: 800;
        font-size: 66px;
        line-height: 1.12;
        letter-spacing: -0.01em;
        color: var(--ink);
        text-shadow:
          0 4px 22px rgba(0, 0, 0, 0.6),
          0 1px 3px rgba(0, 0, 0, 0.7);
      }
      .say .w {
        display: inline-block;
      }
      .say .q {
        color: var(--gold);
      }
      .say.gold {
        color: var(--gold-hi);
      }
      .studio {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 120% 55% at 50% 72%, #2a241e 0%, #17140f 45%, #0b0a09 100%);
      }
      .studio::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 62%;
        bottom: 0;
        background: linear-gradient(180deg, rgba(255, 236, 200, 0.05) 0%, rgba(0, 0, 0, 0.35) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        class="clip" data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="box" data-composition-id="box" data-composition-src="compositions/box.html"
        class="clip" data-start="3.6" data-duration="4.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        class="clip" data-start="8.4" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="macro" data-composition-id="macro" data-composition-src="compositions/macro.html"
        class="clip" data-start="12" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="details" data-composition-id="details" data-composition-src="compositions/details.html"
        class="clip" data-start="16" data-duration="4.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="modes" data-composition-id="modes" data-composition-src="compositions/modes.html"
        class="clip" data-start="20.4" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="result" data-composition-id="result" data-composition-src="compositions/result.html"
        class="clip" data-start="24.4" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        class="clip" data-start="27" data-duration="3" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>

      <!-- music bed: cinematic epic, 100 BPM (generated locally with MusicGen) -->
      <audio id="music" class="clip" src="assets/music/epic-cinematic.wav" data-start="0" data-duration="30" data-track-index="2" data-volume="0.9"></audio>
      <!-- sound effects: each peak lands one frame after its picture -->
      <audio id="sfx-whip1" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.9" data-duration="1.6" data-media-start="1.9" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-lid" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="3.67" data-duration="2.55" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="6.96" data-duration="1.5" data-media-start="2.0" data-track-index="3" data-volume="0.45"></audio>
      <audio id="sfx-reveal" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="8.36" data-duration="2.0" data-track-index="4" data-volume="0.75"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.87" data-duration="0.37" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="13.31" data-duration="0.26" data-track-index="5" data-volume="0.9"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="13.86" data-duration="0.26" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-pop3" class="clip" src="assets/sfx/pop.mp3" data-start="14.46" data-duration="0.26" data-track-index="5" data-volume="0.9"></audio>
      <audio id="sfx-call1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.42" data-duration="0.37" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-call2" class="clip" src="assets/sfx/whoosh.mp3" data-start="17.42" data-duration="0.37" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-call3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="18.42" data-duration="0.37" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-whip2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="19.83" data-duration="1.6" data-media-start="1.9" data-track-index="3" data-volume="0.55"></audio>
      <audio id="sfx-pop4" class="clip" src="assets/sfx/pop.mp3" data-start="22.96" data-duration="0.26" data-track-index="5" data-volume="0.9"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="27.61" data-duration="2.0" data-track-index="4" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
