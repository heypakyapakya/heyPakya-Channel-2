<!DOCTYPE html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;800;900&display=block" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #050506;
        --ink: #f5f1ea;
        --ink-dim: rgba(245, 241, 234, 0.62);
        --orange: #ff7a1a;
        --orange-hot: #ffa24a;
        --gold: #e9b872;
        --cyan: #49e6ff;
        --font-display: "Anton", sans-serif;
        --font-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-body);
        color: var(--ink);
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* ---------- shared type ---------- */
      .kicker {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--orange-hot);
      }
      .display {
        font-family: var(--font-display);
        text-transform: uppercase;
        line-height: 0.92;
        letter-spacing: 0.01em;
      }

      /* ---------- SCENE 1-2 : premium box ---------- */
      #s-box {
        background: radial-gradient(120% 70% at 50% 62%, #1a1210 0%, #0a0808 45%, #030303 100%);
      }
      #box-haze {
        background: radial-gradient(42% 26% at 50% 60%, rgba(255, 122, 26, 0.22), transparent 70%);
        opacity: 0.35;
      }
      #floor {
        position: absolute;
        left: -10%;
        right: -10%;
        top: 1180px;
        height: 760px;
        background: radial-gradient(50% 40% at 50% 10%, rgba(255, 140, 60, 0.16), transparent 70%),
          linear-gradient(#0c0a09, #030303 70%);
      }
      #box-cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 540px 1020px;
      }
      #stage3d {
        position: absolute;
        left: 540px;
        top: 1060px;
        width: 0;
        height: 0;
        perspective: 2200px;
        perspective-origin: 0 -420px;
      }
      #box {
        position: absolute;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        transform: rotateX(-24deg) rotateY(-34deg);
      }
      .face {
        position: absolute;
        backface-visibility: visible;
        background: linear-gradient(160deg, #1d1d20 0%, #0d0d0f 55%, #060607 100%);
        border: 1px solid rgba(255, 255, 255, 0.04);
      }
      .face::after {
        /* foil pin-line */
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 26px;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--orange) 15%, var(--gold) 50%, var(--orange) 85%, transparent);
        opacity: 0.85;
      }
      .face.wall {
        width: 640px;
        height: 300px;
        margin-left: -320px;
        margin-top: -150px;
      }
      #f-front {
        transform: translateZ(320px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #f-back {
        transform: rotateY(180deg) translateZ(320px);
      }
      #f-left {
        transform: rotateY(-90deg) translateZ(320px);
        background: linear-gradient(160deg, #141416, #070708);
      }
      #f-right {
        transform: rotateY(90deg) translateZ(320px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #f-bottom {
        width: 640px;
        height: 640px;
        margin-left: -320px;
        margin-top: -320px;
        transform: rotateX(90deg) translateZ(-150px);
        background: #050505;
      }
      #f-bottom::after,
      #inner-glow::after {
        display: none;
      }
      #inner-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        margin-left: -300px;
        margin-top: -300px;
        transform: translateY(90px) rotateX(90deg);
        background: radial-gradient(closest-side, rgba(255, 190, 120, 1), rgba(255, 122, 26, 0.9) 45%, rgba(120, 40, 0, 0.0) 100%);
        opacity: 0;
      }
      .wordmark {
        font-family: var(--font-body);
        font-weight: 800;
        font-size: 74px;
        letter-spacing: -0.02em;
        color: #e8e3da;
      }
      .wordmark b {
        font-weight: 500;
        color: var(--orange);
      }
      .edition {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 0.55em;
        color: var(--gold);
        text-transform: uppercase;
      }
      .side-mark {
        font-family: var(--font-display);
        font-size: 120px;
        letter-spacing: 0.08em;
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(233, 184, 114, 0.45);
      }

      /* lid */
      #lid-hinge {
        position: absolute;
        width: 0;
        height: 0;
        transform-style: preserve-3d;
        transform: translate3d(0, -152px, -330px) rotateX(0deg);
      }
      .lid {
        position: absolute;
        background: linear-gradient(150deg, #232327 0%, #101012 50%, #070708 100%);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      #lid-top {
        width: 660px;
        height: 660px;
        margin-left: -330px;
        margin-top: -330px;
        transform: translate3d(0, 0, 330px) rotateX(90deg);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #lid-top .emboss {
        font-family: var(--font-body);
        font-weight: 800;
        font-size: 96px;
        letter-spacing: -0.02em;
        color: #0b0b0c;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.08), 0 -1px 0 rgba(0, 0, 0, 0.8);
        transform: rotate(180deg);
      }
      #lid-top .ring {
        position: absolute;
        inset: 60px;
        border: 2px solid rgba(233, 184, 114, 0.35);
        border-radius: 8px;
      }
      #lid-sweep {
        position: absolute;
        top: -40%;
        left: -60%;
        width: 34%;
        height: 180%;
        background: linear-gradient(90deg, transparent, rgba(255, 236, 210, 0.38), transparent);
        transform: rotate(18deg);
      }
      .lid.skirt {
        width: 660px;
        height: 64px;
        margin-left: -330px;
        margin-top: -32px;
      }
      #lid-front {
        transform: translate3d(0, 32px, 660px);
      }
      #lid-front::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10px;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--orange), var(--gold), var(--orange), transparent);
      }
      #lid-back {
        transform: translate3d(0, 32px, 0) rotateY(180deg);
      }
      #lid-left {
        transform: translate3d(-330px, 32px, 330px) rotateY(-90deg);
      }
      #lid-right {
        transform: translate3d(330px, 32px, 330px) rotateY(90deg);
      }

      #beam {
        position: absolute;
        left: 540px;
        top: 1010px;
        width: 900px;
        height: 1400px;
        margin-left: -450px;
        margin-top: -1400px;
        background: radial-gradient(40% 100% at 50% 100%, rgba(255, 196, 130, 0.85), rgba(255, 122, 26, 0.35) 40%, transparent 75%);
        mix-blend-mode: screen;
        transform-origin: 50% 100%;
        opacity: 0;
        filter: blur(6px);
      }
      #box-shadow {
        position: absolute;
        left: 540px;
        top: 1235px;
        width: 860px;
        height: 150px;
        margin-left: -430px;
        background: radial-gradient(closest-side, rgba(0, 0, 0, 0.9), transparent);
      }
      .dust {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 210, 160, 0.95), rgba(255, 140, 60, 0) 70%);
      }

      #hook {
        position: absolute;
        left: 80px;
        right: 160px;
        top: 250px;
      }
      #hook .display {
        font-size: 138px;
        margin-top: 18px;
      }
      #hook .display em {
        font-style: normal;
        color: var(--orange);
      }
      #hook .sub {
        margin-top: 26px;
        font-weight: 500;
        font-size: 34px;
        color: var(--ink-dim);
        letter-spacing: 0.02em;
      }

      /* ---------- SCENE 3 : reveal ---------- */
      #s-reveal {
        background: radial-gradient(70% 45% at 50% 52%, #2a160a 0%, #0b0706 55%, #020202 100%);
      }
      #reveal-word {
        position: absolute;
        left: 0;
        right: 0;
        top: 600px;
        text-align: center;
        font-family: var(--font-display);
        font-size: 236px;
        letter-spacing: 0.06em;
        color: transparent;
        -webkit-text-stroke: 3px rgba(255, 122, 26, 0.55);
        white-space: nowrap;
      }
      #halo {
        position: absolute;
        left: 540px;
        top: 960px;
        width: 1100px;
        height: 1100px;
        margin: -550px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 140, 50, 0.55), rgba(255, 90, 0, 0.18) 55%, transparent 100%);
      }
      #ring {
        position: absolute;
        left: 540px;
        top: 960px;
        width: 860px;
        height: 860px;
        margin: -430px 0 0 -430px;
        border-radius: 50%;
        border: 3px solid rgba(255, 170, 90, 0.0);
        background: conic-gradient(from 0deg, transparent 0 70%, rgba(255, 190, 120, 0.9) 82%, transparent 92%);
        -webkit-mask: radial-gradient(closest-side, transparent 96%, #000 97%, #000 99%, transparent 100%);
        mask: radial-gradient(closest-side, transparent 96%, #000 97%, #000 99%, transparent 100%);
      }
      .hero-wrap {
        position: absolute;
        left: 540px;
        top: 980px;
        width: 900px;
        margin-left: -450px;
        transform-origin: 50% 50%;
      }
      .hero-wrap img {
        display: block;
        width: 900px;
        height: auto;
        transform: translateY(-50%);
      }
      #streak {
        position: absolute;
        left: -200px;
        right: -200px;
        top: 742px;
        height: 6px;
        background: linear-gradient(90deg, transparent, rgba(120, 230, 255, 0.0) 10%, rgba(200, 245, 255, 0.95) 50%, rgba(120, 230, 255, 0.0) 90%, transparent);
        filter: blur(2px);
        mix-blend-mode: screen;
      }
      #reveal-title {
        position: absolute;
        left: 80px;
        right: 160px;
        top: 1430px;
        text-align: center;
      }
      #reveal-title .display {
        font-size: 92px;
        margin-top: 12px;
      }

      /* ---------- SCENE 4 : details ---------- */
      .detail .bg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .detail .macro {
        position: absolute;
        left: 0;
        top: 300px;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        -webkit-mask: linear-gradient(180deg, transparent 0%, #000 16%, #000 70%, transparent 100%);
        mask: linear-gradient(180deg, transparent 0%, #000 16%, #000 70%, transparent 100%);
      }
      .detail .macro img {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1300px;
        height: auto;
        transform: translate(-50%, -50%);
      }
      .callout {
        position: absolute;
        left: 80px;
        right: 160px;
        top: 1290px;
      }
      .callout .idx {
        font-family: var(--font-body);
        font-weight: 800;
        font-size: 28px;
        letter-spacing: 0.3em;
        color: var(--orange);
      }
      .callout .rule {
        width: 120px;
        height: 4px;
        margin: 16px 0 18px;
        background: linear-gradient(90deg, var(--orange), var(--gold));
        transform-origin: 0 50%;
      }
      .callout .display {
        font-size: 112px;
      }
      .callout .sub {
        margin-top: 14px;
        font-weight: 600;
        font-size: 34px;
        color: var(--ink-dim);
      }
      .scrim {
        background: linear-gradient(180deg, transparent 52%, rgba(0, 0, 0, 0.75) 66%, rgba(0, 0, 0, 0.92) 100%);
      }
      .lightleak {
        background: radial-gradient(60% 40% at 85% 20%, rgba(255, 140, 50, 0.35), transparent 70%);
        mix-blend-mode: screen;
      }

      /* ---------- SCENE 5 : CTA ---------- */
      #s-cta {
        background: radial-gradient(80% 50% at 50% 45%, #241309 0%, #0a0706 55%, #020202 100%);
      }
      #podium {
        position: absolute;
        left: 540px;
        top: 1150px;
        width: 760px;
        height: 150px;
        margin-left: -380px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 150, 70, 0.55), rgba(255, 110, 20, 0.15) 60%, transparent);
      }
      #podium-line {
        position: absolute;
        left: 540px;
        top: 1222px;
        width: 640px;
        height: 3px;
        margin-left: -320px;
        background: linear-gradient(90deg, transparent, var(--orange-hot), transparent);
      }
      #cta-head {
        position: absolute;
        left: 80px;
        right: 160px;
        top: 230px;
        text-align: center;
      }
      #cta-head .display {
        font-size: 104px;
        margin-top: 14px;
      }
      #cta-head .display em {
        font-style: normal;
        color: var(--orange);
      }
      #chips {
        position: absolute;
        left: 80px;
        right: 160px;
        top: 1290px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }
      .chip {
        padding: 14px 24px;
        border-radius: 999px;
        border: 2px solid rgba(255, 162, 74, 0.6);
        background: rgba(20, 12, 8, 0.7);
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.04em;
      }
      #cta-btn {
        position: absolute;
        left: 120px;
        width: 800px;
        top: 1440px;
        height: 132px;
        border-radius: 70px;
        background: linear-gradient(180deg, #ffd23f, #ffb000);
        box-shadow: 0 0 60px rgba(255, 190, 40, 0.55), inset 0 -6px 0 rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #1a1206;
        font-family: var(--font-display);
        font-size: 64px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      #cta-btn svg {
        width: 64px;
        height: 64px;
      }

      /* ---------- global finishing ---------- */
      #flash {
        background: radial-gradient(60% 40% at 50% 55%, #fff6e8, #ffb36b 55%, #ff7a1a 100%);
        opacity: 0;
        z-index: 50;
      }
      #vignette {
        background: radial-gradient(120% 85% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
        z-index: 60;
      }
      #bars-top,
      #bars-bot {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        background: #000;
        z-index: 70;
      }
      #bars-top {
        top: 0;
      }
      #bars-bot {
        bottom: 0;
      }
      #fade {
        opacity: 0;
        background: #000;
        z-index: 80;
      }
    </style>
    <style>
      /* ---- teaser-only ---- */
      #t-hook {
        position: absolute;
        left: 80px;
        right: 160px;
        top: 250px;
      }
      #t-hook .display {
        font-size: 150px;
        margin-top: 16px;
      }
      #t-hook .display em {
        font-style: normal;
        color: var(--orange);
      }
      .punch .word {
        position: absolute;
        left: 80px;
        right: 160px;
        top: 1300px;
        font-family: var(--font-display);
        font-size: 210px;
        line-height: 0.9;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
      }
      .punch .word em {
        font-style: normal;
        color: var(--orange);
      }
      #t-pill {
        position: absolute;
        left: 50%;
        top: 1580px;
        transform: translateX(-50%);
        padding: 22px 44px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffd23f, #ffb000);
        box-shadow: 0 0 50px rgba(255, 190, 40, 0.5);
        display: flex;
        align-items: center;
        gap: 16px;
        color: #1a1206;
        font-family: var(--font-display);
        font-size: 50px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #t-pill svg {
        width: 50px;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-wcha" id="root" data-composition-id="teaser" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <!-- ============ 0–1.8 : box close-up, lid cracks, light leaks ============ -->
      <div data-hf-id="hf-lpcp" id="s-box" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div data-hf-id="hf-eptv" id="box-haze" class="layer"></div>
        <div data-hf-id="hf-5ntm" id="box-cam">
          <div data-hf-id="hf-snk9" id="floor"></div>
          <div data-hf-id="hf-syat" id="box-shadow"></div>
          <div data-hf-id="hf-tgow" id="beam"></div>
          <div data-hf-id="hf-m6ck" id="stage3d">
            <div data-hf-id="hf-2l2g" id="box">
              <div data-hf-id="hf-pc2j" id="f-bottom" class="face"></div>
              <div data-hf-id="hf-tj27" id="inner-glow" class="face"></div>
              <div data-hf-id="hf-c2q5" id="f-back" class="face wall"></div>
              <div data-hf-id="hf-4lm7" id="f-left" class="face wall"></div>
              <div data-hf-id="hf-f0gy" id="f-right" class="face wall"><span data-hf-id="hf-thcb" class="side-mark" data-layout-ignore="">TWS</span></div>
              <div data-hf-id="hf-49vt" id="f-front" class="face wall">
                <div data-hf-id="hf-0oum" class="wordmark" data-layout-ignore="">think<b data-hf-id="hf-v2qd">plus</b></div>
                <div data-hf-id="hf-smvw" class="edition" data-layout-ignore="">WuKong Edition</div>
              </div>
              <div data-hf-id="hf-kzky" id="lid-hinge">
                <div data-hf-id="hf-41cd" id="lid-back" class="lid skirt"></div>
                <div data-hf-id="hf-wk8f" id="lid-left" class="lid skirt"></div>
                <div data-hf-id="hf-17oi" id="lid-right" class="lid skirt"></div>
                <div data-hf-id="hf-qh3d" id="lid-front" class="lid skirt"></div>
                <div data-hf-id="hf-q57y" id="lid-top" class="lid">
                  <div data-hf-id="hf-0qcu" class="ring"></div>
                  <div data-hf-id="hf-rl74" class="emboss" data-layout-ignore="">thinkplus</div>
                  <div data-hf-id="hf-6mbj" id="lid-sweep"></div>
                </div>
              </div>
            </div>
          </div>
          <div data-hf-id="hf-zqlx" id="dust" class="layer"></div>
        </div>
        <div data-hf-id="hf-1p41" id="t-hook">
          <div data-hf-id="hf-c130" class="kicker">Lenovo thinkplus</div>
          <div data-hf-id="hf-z9wa" class="display">Sesuatu<br data-hf-id="hf-x5px"><em data-hf-id="hf-1wd3">Padu</em> Tiba.</div>
        </div>
      </div>

      <!-- ============ 1.8–3.15 : three macro punches on the beat ============ -->

    <script>
      (function () {
        let s = 4242;
        const rnd = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
        const host = document.getElementById("dust");
        for (let i = 0; i < 40; i++) {
          const d = document.createElement("div");
          d.className = "dust";
          const size = 3 + rnd() * 9;
          d.style.width = d.style.height = size + "px";
          d.style.left = 140 + rnd() * 800 + "px";
          d.style.top = 520 + rnd() * 760 + "px";
          d.style.opacity = (0.25 + rnd() * 0.6).toFixed(2);
          d.dataset.dx = ((rnd() - 0.5) * 60).toFixed(1);
          d.dataset.dy = (-30 - rnd() * 90).toFixed(1);
          host.appendChild(d);
        }
      })();

      const BEAT = 0.45;
      const tl = gsap.timeline({ paused: true });

      // bars already in on frame 0 (thumbnail)
      tl.fromTo("#bars-top, #bars-bot", { height: 70 }, { height: 90, duration: 1.0, ease: "power2.out" }, 0);

      // ---- 0–1.8 box close-up ----
      tl.fromTo("#box-cam", { scale: 1.12, y: 40 }, { scale: 1.34, y: 120, duration: 1.95, ease: "power2.in" }, 0);
      tl.fromTo("#box", { rotationY: -40, rotationX: -22 }, { rotationY: -30, rotationX: -27, duration: 1.95, ease: "sine.inOut" }, 0);
      tl.fromTo("#lid-sweep", { x: 0, rotation: 18 }, { x: 1250, rotation: 18, duration: 0.8, ease: "power2.inOut" }, 0.05);
      tl.fromTo("#box-haze", { opacity: 0.3 }, { opacity: 0.8, duration: 1.8 }, 0);
      document.querySelectorAll("#dust .dust").forEach((d) => {
        tl.fromTo(d, { x: 0, y: 0 }, { x: +d.dataset.dx, y: +d.dataset.dy, duration: 2, ease: "none" }, 0);
      });
      tl.to("#lid-hinge", { rotationX: 9, duration: 0.2, ease: "power2.out" }, 0.45); // crack (beat 1)
      tl.to("#inner-glow", { opacity: 0.6, duration: 0.2 }, 0.45);
      tl.to("#beam", { opacity: 0.4, scaleX: 0.5, duration: 0.2 }, 0.45);
      tl.to("#lid-hinge", { rotationX: 70, duration: 0.9, ease: "power3.in" }, 0.9); // lift (beat 2)
      tl.to("#inner-glow", { opacity: 1, duration: 0.9, ease: "power2.in" }, 0.9);
      tl.fromTo("#beam", { scaleY: 0.5 }, { opacity: 1, scaleX: 1.1, scaleY: 1.2, duration: 0.9, ease: "power2.in" }, 0.9);

      tl.fromTo("#t-hook .kicker", { opacity: 0.9, scaleX: 1.25, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#t-hook .display", { opacity: 0.92, scale: 1.06, filter: "blur(3px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0);
      tl.to("#t-hook", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 1.35);

      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power3.in" }, 1.55);
      tl.to("#flash", { opacity: 0, duration: 0.2, ease: "power2.out" }, 1.8);

      // ---- 1.8–3.15 macro punches (one per beat) ----
      [
        { id: "#p1", t: 1.8, from: { scale: 1.0, x: 0 }, to: { scale: 1.18, x: -40 } },
        { id: "#p2", t: 2.25, from: { scale: 1.1, x: 0 }, to: { scale: 1.3, x: -70 } },
        { id: "#p3", t: 2.7, from: { scale: 1.15, x: 0 }, to: { scale: 1.0, x: 0 } },
      ].forEach((p) => {
        tl.fromTo(p.id + " .macro img", { xPercent: -50, yPercent: -50, ...p.from }, { xPercent: -50, yPercent: -50, ...p.to, duration: BEAT, ease: "power1.out" }, p.t);
        tl.fromTo(p.id + " .macro", { scale: 1.15, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, p.t);
        tl.fromTo(p.id + " .word", { scale: 1.35, opacity: 0, transformOrigin: "0% 100%" }, { scale: 1, opacity: 1, duration: 0.16, ease: "power4.out" }, p.t);
        if (p.t > 1.8) tl.fromTo("#flash", { opacity: 0.6 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, p.t);
      });

      // ---- 3.15–5.0 reveal ----
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, 3.15);
