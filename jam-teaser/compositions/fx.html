<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #fx-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    #fx-leak { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen;
      background: radial-gradient(ellipse 70% 45% at 85% 20%, rgba(255,170,90,.75) 0%, rgba(255,120,60,0) 70%),
                  radial-gradient(ellipse 60% 40% at 10% 85%, rgba(70,140,255,.6) 0%, rgba(70,140,255,0) 70%); }
    #fx-bars-top, #fx-bars-bot { position: absolute; left: 0; width: 1080px; height: 70px; background: #000; }
    #fx-bars-top { top: 0; } #fx-bars-bot { bottom: 0; }
  </style>
  <div id="root" data-composition-id="fx" data-width="1080" data-height="1920">
    <div id="fx-leak" data-layout-ignore></div>
    <div id="fx-flash" data-layout-ignore></div>
    <div id="fx-bars-top" data-layout-ignore></div>
    <div id="fx-bars-bot" data-layout-ignore></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // white-hot flash on every hard cut, strongest on the end-card slam
    const cuts = [[0.9, 0.55], [1.5, 0.45], [2.1, 0.5], [2.7, 0.4], [3.2, 0.45], [3.9, 0.95]];
    tl.set("#fx-flash", { opacity: 0 }, 0);
    cuts.forEach(([t, peak]) => {
      tl.fromTo("#fx-flash", { opacity: peak }, { opacity: 0, duration: t === 3.9 ? 0.32 : 0.14, ease: "power2.out", immediateRender: false }, t);
    });
    // warm/cool light leak breathing through the hook and the end card
    tl.fromTo("#fx-leak", { opacity: 0.55 }, { opacity: 0, duration: 0.7, ease: "power2.out" }, 0);
    tl.fromTo("#fx-leak", { opacity: 0 }, { opacity: 0.35, duration: 0.25, ease: "power2.out", immediateRender: false }, 3.2);
    tl.to("#fx-leak", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.5);
    tl.fromTo("#fx-leak", { opacity: 0.7 }, { opacity: 0.25, duration: 1.0, ease: "power2.out", immediateRender: false }, 3.9);
    // cinematic bars squeeze in for the slam
    tl.fromTo(["#fx-bars-top", "#fx-bars-bot"], { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "expo.out" }, 0);
    tl.to(["#fx-bars-top", "#fx-bars-bot"], { scaleY: 1.6, duration: 0.3, ease: "expo.out" }, 3.9);
    tl.to({}, { duration: 0.01 }, 4.99);
    window.__timelines["fx"] = tl;
  </script>
</template>
