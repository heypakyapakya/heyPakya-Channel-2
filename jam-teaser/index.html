<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #03060c; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-fps="30" data-width="1080" data-height="1920">
      <div id="hook"  data-composition-id="hook"  data-composition-src="compositions/hook.html"  data-start="0"   data-duration="0.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="tough" data-composition-id="tough" data-composition-src="compositions/tough.html" data-start="0.9" data-duration="0.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="water" data-composition-id="water" data-composition-src="compositions/water.html" data-start="1.5" data-duration="0.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="dual"  data-composition-id="dual"  data-composition-src="compositions/dual.html"  data-start="2.1" data-duration="0.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="wrist" data-composition-id="wrist" data-composition-src="compositions/wrist.html" data-start="2.7" data-duration="0.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="face"  data-composition-id="face"  data-composition-src="compositions/face.html"  data-start="3.2" data-duration="0.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="end"   data-composition-id="end"   data-composition-src="compositions/end.html"   data-start="3.9" data-duration="1.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="fx"    data-composition-id="fx"    data-composition-src="compositions/fx.html"    data-start="0"   data-duration="5"   data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>

      <!-- music: original cinematic score (tools/score.py) -->
      <audio id="score" class="clip" src="assets/audio/score.wav" data-start="0" data-duration="5" data-track-index="3" data-volume="0.504"></audio>
      <!-- sfx: peaks placed one frame after the picture -->
      <audio id="sfx-hit-open" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="0" data-media-start="0.04" data-duration="1.6" data-track-index="4" data-volume="0.392"></audio>
      <audio id="sfx-wh-1" class="clip" src="assets/audio/whoosh-cinematic.mp3" data-start="0.73" data-media-start="2.3" data-duration="0.6" data-track-index="5" data-volume="0.308"></audio>
      <audio id="sfx-wh-2" class="clip" src="assets/audio/whoosh-short.mp3" data-start="1.371" data-duration="0.5" data-track-index="5" data-volume="0.336"></audio>
      <audio id="sfx-wh-3" class="clip" src="assets/audio/whoosh-cinematic.mp3" data-start="1.93" data-media-start="2.3" data-duration="0.6" data-track-index="6" data-volume="0.280"></audio>
      <audio id="sfx-wh-4" class="clip" src="assets/audio/whoosh-short.mp3" data-start="2.571" data-duration="0.5" data-track-index="5" data-volume="0.308" data-playback-rate="1.15"></audio>
      <audio id="sfx-wh-5" class="clip" src="assets/audio/whoosh-cinematic.mp3" data-start="3.03" data-media-start="2.3" data-duration="0.6" data-track-index="6" data-volume="0.280"></audio>
      <audio id="sfx-hit-end" class="clip" src="assets/audio/impact-bass-2.mp3" data-start="1.947" data-duration="2.59" data-track-index="4" data-volume="0.448" data-fade-out="0.3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
